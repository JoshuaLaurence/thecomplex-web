<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#171610" />
    <title>The Complex — procedural preview</title>
    <script type="module" crossorigin src="/assets/index-BZEioRU7.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-D2VuGdZM.css">
  </head>
  <body>
    <main id="app" aria-label="Procedural Backrooms preview">
      <section
        id="pause-menu"
        class="pause-menu"
        aria-label="Pause menu"
        hidden
      >
        <div class="pause-panel">
          <p class="menu-title">PAUSED</p>
          <div class="menu-row">
            <span>SEED</span>
            <span id="seed-label"></span>
          </div>
          <div class="menu-row">
            <span>CONTROLS</span>
            <span>WASD · MOUSE · ESC</span>
          </div>
          <label class="sensitivity-row" for="sensitivity">
            <span>SENSITIVITY</span>
            <output id="sensitivity-value" for="sensitivity">1.0×</output>
          </label>
          <input
            id="sensitivity"
            type="range"
            min="0.5"
            max="2.5"
            step="0.1"
            value="1"
          />
          <button id="continue-button" type="button">CONTINUE</button>
        </div>
      </section>
    </main>
  </body>
</html>
